# Font
font_family               MesloLGS Nerd Font Mono
font_size                 14.0
text_composition_strategy 1.2 30
modify_font               cell_height 105%

# Window
initial_window_width          140c
initial_window_height         40c
remember_window_size          no
scrollback_lines              20000
scrollback_pager_history_size 100
window_padding_width          14
placement_strategy            center
background_opacity            1.0
background_blur               0
dim_opacity                   1.0

# macOS
hide_window_decorations    titlebar-only
macos_show_window_title_in none
macos_option_as_alt        left

# Selection
copy_on_select yes

# Cursor
cursor                     #89b4fa
cursor_text_color          #1e1e2e
cursor_shape               block
cursor_trail               0
cursor_stop_blinking_after 15

# Shell integration
shell_integration no-cursor

# Tab bar
tab_bar_edge             top
tab_bar_style            separator
tab_separator            "│"
tab_bar_align            left
tab_bar_margin_height    0 0
tab_bar_margin_color     #1e1e2e
tab_bar_background       #1e1e2e
active_tab_foreground    #89b4fa
active_tab_background    #313244
inactive_tab_foreground  #a6adc8
inactive_tab_background  #1e1e2e
active_tab_font_style    bold
inactive_tab_font_style  normal
tab_title_template       "  {index} {title}  "
tab_title_max_length     48

# Splits
enabled_layouts       splits:split_axis=vertical
window_border_width   1
draw_minimal_borders  yes
active_border_color   #89b4fa
inactive_border_color #45475a
map cmd+d             launch --location=vsplit --cwd=current
map cmd+shift+d       launch --location=hsplit --cwd=current
map cmd+alt+left      neighboring_window left
map cmd+alt+right     neighboring_window right
map cmd+alt+up        neighboring_window up
map cmd+alt+down      neighboring_window down
map cmd+shift+w       close_window

# Tabs
map cmd+t     new_tab_with_cwd
map cmd+left  previous_tab
map cmd+right next_tab
map cmd+1     goto_tab 1
map cmd+2     goto_tab 2
map cmd+3     goto_tab 3
map cmd+4     goto_tab 4
map cmd+5     goto_tab 5
map cmd+6     goto_tab 6
map cmd+7     goto_tab 7
map cmd+8     goto_tab 8
map cmd+9     goto_tab 9

# Miscellaneous
map cmd+k             clear_terminal scrollback active
map cmd+f             show_scrollback
enable_audio_bell     no
visual_bell_duration  0
url_style             curly
url_color             #94e2d5
undercurl_style       thick-sparse
mark1_foreground      #1e1e2e
mark1_background      #f38ba8
mark2_foreground      #1e1e2e
mark2_background      #f9e2af
mark3_foreground      #1e1e2e
mark3_background      #94e2d5

# Catppuccin Mocha
# https://github.com/catppuccin/kitty
foreground           #cdd6f4
background           #1e1e2e
selection_foreground #cdd6f4
selection_background #313244

