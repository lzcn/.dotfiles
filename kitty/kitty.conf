# Tokyo Night Storm

# Font
font_family               MesloLGS Nerd Font Mono
font_size                 14.0
text_composition_strategy 1.2 30
modify_font               cell_height 105%

# Window
initial_window_width    140c
initial_window_height   40c
remember_window_size    no
# Interactive scrollback only. Docs warn that very large values "can slow down
# performance of the terminal and also use large amounts of RAM"; 100000 was
# 50x the 2000 default. Deep history is still kept for the pager below, so
# cmd+f reaches far back while interactive scrolling stays cheap.
scrollback_lines        20000
scrollback_pager_history_size 100
window_padding_width    14
placement_strategy      center
# Glass effect. Opacity below 1 is what enables the see-through look, and
# blur only applies while opacity < 1 — so both dials move together.
# Softened from opacity 0.95 / blur 32. Blur remains the most expensive
# option in this file: docs warn too high a value "will cause severe
# performance issues and/or rendering artifacts".
background_opacity      0.98
background_blur         8
dim_opacity             0.75

# macOS
hide_window_decorations    titlebar-only
macos_titlebar_color       background
macos_show_window_title_in none
macos_option_as_alt        left

# Selection
copy_on_select yes

# Remote control (required by smart-splits.nvim)
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# Cursor
cursor                       #C0CAF5
cursor_text_color            #24283B
cursor_shape                 block

# Cursor trail: fading afterimage following large cursor jumps.
# Kept as an accent, dialled back so it does not read as constant motion.
#   cursor_trail <ms>   : cursor must hold still this long before a trail
#                         is drawn -> filters TUI redraw and rapid typing
#                         churn. Was 3 (fired on almost every move).
#   ..._start_threshold : minimum jump (cells) that spawns a trail. Was 2.
#   ..._decay <fast> <slow> : fade time in seconds; SMALLER fades faster.
#                         Was 0.1 0.4.
cursor_trail                 25
cursor_trail_start_threshold 3
cursor_trail_decay           0.06 0.3
cursor_stop_blinking_after   15

# Shell integration
# `no-cursor` stops kitty's shell integration from rewriting the cursor
# shape at shell prompts. Without it the cursor renders as `beam` in local
# sessions but stays `block` over SSH (remote shells carry no integration
# script, so nothing overrides cursor_shape) — same terminal, two looks.
# Everything else integration provides (prompt marks, cwd reporting,
# window title) stays enabled; only the cursor rewrite is dropped.
shell_integration            no-cursor

# Tab bar
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      angled
tab_bar_align            center
tab_bar_margin_height    6 4
tab_bar_margin_color     #1A1B26
tab_bar_background       #1A1B26
active_tab_foreground    #1F2335
active_tab_background    #7AA2F7
inactive_tab_foreground  #565F89
inactive_tab_background  #292E42
active_tab_font_style    bold
tab_title_template       " {index} {title} "
tab_title_max_length     48

# Splits
enabled_layouts      splits:split_axis=vertical
window_border_width  2
draw_minimal_borders yes
active_border_color  #7AA2F7
inactive_border_color #292E42
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
map cmd+shift+w   close_window

# Tab shortcuts
map cmd+t     new_tab_with_cwd
map cmd+left  previous_tab
map cmd+right next_tab
map cmd+1     goto_tab 1
map cmd+2     goto_tab 2
map cmd+3     goto_tab 3
map cmd+4     goto_tab 4
map cmd+5     goto_tab 5
map cmd+6     goto_tab 6
map cmd+7     goto_tab 7
map cmd+8     goto_tab 8
map cmd+9     goto_tab 9

map cmd+k clear_terminal scrollback active
map cmd+f show_scrollback

# Bells
enable_audio_bell    no
visual_bell_duration 0

# URLs
url_style curly
url_color #7DCFFF

# Highlights
# Search / hint match highlights, plus thicker diagnostic undercurls.
undercurl_style  thick-sparse
mark1_foreground #1F2335
mark1_background #F7768E
mark2_foreground #1F2335
mark2_background #E0AF68
mark3_foreground #1F2335
mark3_background #7DCFFF

# Colors
foreground           #C0CAF5
background           #24283B
selection_foreground #C0CAF5
selection_background #3658A0
cursor               #C0CAF5

# black
color0  #1D202F
color8  #414868
# red
color1  #F7768E
color9  #F7768E
# green
color2  #9ECE6A
color10 #9ECE6A
# yellow
color3  #E0AF68
color11 #E0AF68
# blue
color4  #7AA2F7
color12 #7AA2F7
# magenta
color5  #BB9AF7
color13 #BB9AF7
# cyan
color6  #7DCFFF
color14 #7DCFFF
# white
color7  #A9B1D6
color15 #C0CAF5
