# see https://docs.atuin.sh/configuration/config
auto_sync = true
filter_mode = "host"
search_mode = "fuzzy"
style = "compact"
update_check = false
inline_height = 15
invert = true

# Keep optional AI, terminal proxy, and output capture disabled.
ai.enabled = false
daemon.enabled = false
daemon.autostart = false
pty_proxy.enabled = false
output.enabled = false
threads.capture = false

[theme]
name = "catppuccin-mocha"

[sync]
records = true
